spring.application.name=money-tracker
server.port=8082

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5434/moneytracker
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=moneytracker
spring.datasource.password=moneytracker

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Connection pool (optional tuning)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# JWT
jwt.secret=${JWT_SECRET:moneyTrackerSecretKey2024ForJwtTokenGenerationAndValidationMustBeAtLeast256BitsLongForSecurity}
jwt.expiration=86400000

# CORS
cors.allowed-origins=http://localhost:4202
