server.port=8082

# PostgreSQL Database (configured via environment variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/moneytracker}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USER:moneytracker}
spring.datasource.password=${DB_PASSWORD:moneytracker}

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# JWT (MUST be overridden via env var in production)
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# CORS (nginx handles same-origin, but keep for direct API access if needed)
cors.allowed-origins=${CORS_ORIGINS:}

# Logging
logging.level.org.springframework.security=WARN
logging.level.com.moneytracker=INFO
