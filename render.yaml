services:
  - type: web
    name: money-tracker-backend
    runtime: docker
    # plan: starter  # Uncomment and set to your Render plan
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        # Update this after deploying the frontend
        value: https://money-tracker-frontend.onrender.com
      # Database env vars — set these manually in Render Dashboard
      # DB_URL: jdbc:postgresql://HOST:5432/DB_NAME?sslmode=require
      # DB_USER: moneytracker
      # DB_PASSWORD: your-render-db-password
